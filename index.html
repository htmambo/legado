<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>开源阅读Tauri</title>
    <style>
      /* 首屏骨架屏：在 Vue 挂载前立即显示，避免白屏等待 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #18181b;
      }
      #app-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #18181b;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }
      #app-skeleton.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-skeleton.boot-error {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 4vh 16px 16px;
        overflow-y: auto;
      }
      .skeleton-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #3f3f46;
        border-top-color: #818cf8;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .skeleton-error {
        width: min(720px, 100%);
        border: 1px solid rgba(239, 68, 68, 0.28);
        border-radius: 12px;
        background: rgba(24, 24, 27, 0.96);
        color: #fafafa;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        padding: 20px;
      }
      .skeleton-error__title {
        font-size: 18px;
        font-weight: 700;
      }
      .skeleton-error__count {
        margin-top: 4px;
        font-size: 13px;
        color: #fca5a5;
      }
      .skeleton-error__list {
        margin-top: 12px;
        max-height: 60vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 4px;
      }
      .skeleton-error__item {
        border: 1px solid rgba(239, 68, 68, 0.18);
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.18);
      }
      .skeleton-error__item-meta {
        font-size: 12px;
        color: #a1a1aa;
        margin-bottom: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .skeleton-error__item-msg {
        white-space: pre-wrap;
        word-break: break-word;
        color: #e4e4e7;
        line-height: 1.55;
        font-size: 13px;
      }
      .skeleton-error__hint {
        margin-top: 14px;
        font-size: 13px;
        color: #a1a1aa;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f4f4f5;
        }
        #app-skeleton {
          background: #f4f4f5;
        }
        .skeleton-spinner {
          border-color: #e4e4e7;
          border-top-color: #6366f1;
        }
        .skeleton-error {
          border-color: rgba(239, 68, 68, 0.22);
          background: rgba(255, 255, 255, 0.96);
          color: #18181b;
          box-shadow: 0 18px 50px rgba(24, 24, 27, 0.16);
        }
        .skeleton-error__count {
          color: #b91c1c;
        }
        .skeleton-error__item {
          border-color: rgba(239, 68, 68, 0.2);
          background: rgba(0, 0, 0, 0.03);
        }
        .skeleton-error__item-meta {
          color: #71717a;
        }
        .skeleton-error__item-msg {
          color: #27272a;
        }
        .skeleton-error__hint {
          color: #52525b;
        }
      }
      @keyframes spin {
        to {
          transform: translateX(0) rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- 骨架屏：Vue 挂载完成后由 main.ts 隐藏 -->
    <div id="app-skeleton"><div class="skeleton-spinner"></div></div>
    <div id="app"></div>
    <script>
      (() => {
        const BOOT_TIMEOUT_MS = 15000;
        const MAX_ERROR_ITEMS = 50; // 防止错误风暴把页面撑爆
        const state = {
          stage: "html-ready",
          /** 已经有错误进入错误覆盖层（用于阻止 main.ts 自动隐藏骨架屏） */
          hasBootError: false,
          /** 已累积的错误条目（[{source, message}]） */
          errors: [],
          /** 错误覆盖层 DOM 引用 */
          errorOverlayEl: null,
          /** 错误列表 DOM 引用 */
          errorListEl: null,
          /** 错误计数 DOM 引用 */
          errorCountEl: null,
        };

        function escapeHtml(value) {
          return String(value).replace(/[&<>"']/g, (ch) => {
            if (ch === "&") return "&amp;";
            if (ch === "<") return "&lt;";
            if (ch === ">") return "&gt;";
            if (ch === '"') return "&quot;";
            return "&#39;";
          });
        }

        function loadVConsoleForDebug() {
          if (window.__vcDebugLoading) return;
          window.__vcDebugLoading = true;
          var s = document.createElement("script");
          s.src = "https://unpkg.com/vconsole@latest/dist/vconsole.min.js";
          s.onload = function () {
            var isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var vc = new window.VConsole({
              theme: isDark ? "dark" : "light",
            });
            vc.show();
          };
          document.head.appendChild(s);
        }

        function formatReason(reason) {
          if (!reason) return "未知错误";
          if (typeof reason === "string") return reason;
          if (reason instanceof Error) return reason.stack || reason.message || String(reason);
          if (typeof reason === "object") {
            try {
              return JSON.stringify(reason, null, 2);
            } catch (_) {
              return String(reason);
            }
          }
          return String(reason);
        }

        function pushError(source, message) {
          // 写一份到 console，方便带 devtools 的同学看完整 stack
          // eslint-disable-next-line no-console
          console.error(`[BOOT][${source}]`, message);
          state.errors.push({ source, message, ts: new Date() });
          if (state.errors.length > MAX_ERROR_ITEMS) {
            state.errors.splice(0, state.errors.length - MAX_ERROR_ITEMS);
          }
          renderBootError();
          // 顺手写一份到 Rust 的 frontend.log（命令未注册时会静默失败，不阻塞 UI）
          try {
            if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
              window.__TAURI_INTERNALS__.invoke("frontend_log", {
                level: "error",
                message: `[${source}] ${String(message).slice(0, 2000)}`,
              }).catch(() => {});
            }
          } catch (_) {
            /* ignore */
          }
        }

        function ensureOverlay() {
          if (state.errorOverlayEl) return;
          const skeleton = document.getElementById("app-skeleton");
          if (!skeleton) return;
          loadVConsoleForDebug();
          skeleton.classList.remove("hidden");
          skeleton.classList.add("boot-error");
          skeleton.innerHTML =
            '<div class="skeleton-error">' +
            '<div class="skeleton-error__title">应用启动异常</div>' +
            '<div class="skeleton-error__count" data-role="count"></div>' +
            '<div class="skeleton-error__list" data-role="list"></div>' +
            '<div class="skeleton-error__hint">请按 F12 打开 DevTools 查看完整报错；详细日志同时已写入 frontend.log。</div>' +
            "</div>";
          state.errorOverlayEl = skeleton.querySelector(".skeleton-error");
          state.errorCountEl = skeleton.querySelector('[data-role="count"]');
          state.errorListEl = skeleton.querySelector('[data-role="list"]');
        }

        function renderBootError() {
          state.hasBootError = true;
          ensureOverlay();
          if (!state.errorOverlayEl) return;

          const total = state.errors.length;
          state.errorCountEl.textContent =
            total === 1
              ? "捕获到 1 条异常"
              : `捕获到 ${total} 条异常（仅显示最近 ${MAX_ERROR_ITEMS} 条）`;

          // 用 DocumentFragment 一次性重建列表，避免抖动
          const frag = document.createDocumentFragment();
          for (let i = state.errors.length - 1; i >= 0; i--) {
            const item = state.errors[i];
            const div = document.createElement("div");
            div.className = "skeleton-error__item";
            const meta = document.createElement("div");
            meta.className = "skeleton-error__item-meta";
            meta.textContent = `[${escapeHtml(item.source)}] ${item.ts.toISOString()}`;
            const msg = document.createElement("div");
            msg.className = "skeleton-error__item-msg";
            msg.textContent = item.message;
            div.appendChild(meta);
            div.appendChild(msg);
            frag.appendChild(div);
          }
          state.errorListEl.replaceChildren(frag);
        }

        window.__LEGADO_SET_BOOT_STAGE = (stage) => {
          state.stage = stage;
        };
        window.__LEGADO_SHOW_BOOT_ERROR = (message) => {
          pushError("BOOT", message);
        };
        // 给 main.ts 用：询问是否已被错误覆盖层接管
        window.__LEGADO_HAS_BOOT_ERROR = () => state.hasBootError;
        // 暴露当前已收集的错误，给 Vue 端在 app mounted 后做兜底恢复
        window.__LEGADO_GET_BOOT_ERRORS = () => state.errors.slice();

        window.addEventListener("error", (event) => {
          const details =
            event.error?.stack ||
            event.message ||
            `资源加载失败: ${event.filename || "unknown file"}`;
          pushError("window.error", details);
        });

        window.addEventListener("unhandledrejection", (event) => {
          pushError("unhandledrejection", formatReason(event.reason));
        });

        window.setTimeout(() => {
          if (state.stage !== "app-mounted" && !state.hasBootError) {
            pushError(
              "boot-timeout",
              `前端入口在 ${BOOT_TIMEOUT_MS / 1000}s 内没有完成挂载，当前阶段: ${state.stage}`,
            );
          }
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
